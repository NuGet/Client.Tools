name: $(Date:yyyyMMdd).$(Rev:r)
appendCommitMessageToRunName: false

parameters:
- name: DotnetPackageSkillsReleaseBuild
  type: boolean
  default: false

trigger:
- main

pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: NetCore1ESPool-Internal
      demands: ImageOverride -equals windows.vs2026.amd64
      os: windows
    stages:
    - ${{ if and(eq(variables['Build.Repository.Provider'], 'TfsGit'), eq(variables['Build.Repository.Name'], 'NuGet-Client.Tools'), eq(variables['System.TeamProject'], 'internal'), eq(variables['System.CollectionUri'], 'https://dev.azure.com/dnceng/'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], ''), ne(variables['Build.Reason'], 'PullRequest'), or(eq(parameters.DotnetPackageSkillsReleaseBuild, false), eq(variables['Build.Reason'], 'Manual'))) }}:
      - template: /eng/pipelines/dotnet-package-skills/stage.yml@self
        parameters:
          jobsTemplate: /eng/common/templates-official/jobs/jobs.yml@self
          isOfficialBuild: true
          releaseBuild: ${{ parameters.DotnetPackageSkillsReleaseBuild }}
    - ${{ else }}:
      - stage: DotnetPackageSkills
        jobs:
        - job: RejectUntrustedSource
          steps:
          - script: exit /b 1
            displayName: Official builds require trusted internal main; stable releases require a manual run
