trigger:
- main

pr: none

parameters:
- name: DotnetPackageSkillsReleaseBuild
  displayName: Produce a stable dotnet-package-skills package (manual main builds only)
  type: boolean
  default: false

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: NetCore1ESPool-Internal
      demands: ImageOverride -equals windows.vs2026.amd64
      os: windows
    stages:
    - template: /eng/pipelines/dotnet-package-skills/stage.yml@self
      parameters:
        isOfficialBuild: true
        releaseBuild: ${{ parameters.DotnetPackageSkillsReleaseBuild }}
